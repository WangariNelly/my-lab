extends: default
ignore: |
  **/templates/**
  **/charts/**
rules:
  line-length: { max: 160, level: warning }
  document-start: disable
  braces: { min-spaces-inside: 0, max-spaces-inside: 1 }
  truthy: { allowed-values: ["true", "false", "on"] }
  comments: { min-spaces-from-content: 1 }
  indentation: { spaces: consistent, indent-sequences: whatever }
